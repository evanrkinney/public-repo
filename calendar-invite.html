<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar Invite</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Roboto,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:20px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="padding:24px 24px 16px 24px;border-bottom:1px solid #eeeeee;">
              <span style="font-size:20px;color:#202124;font-weight:400;">Team Sync Meeting</span>
            </td>
          </tr>

          <!-- Details -->
          <tr>
            <td style="padding:20px 24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-bottom:14px;color:#5f6368;font-size:14px;width:90px;vertical-align:top;">When</td>
                  <td style="padding-bottom:14px;color:#202124;font-size:14px;">Thursday, June 12, 2026<br>2:00pm – 3:00pm (GMT)</td>
                </tr>
                <tr>
                  <td style="padding-bottom:14px;color:#5f6368;font-size:14px;vertical-align:top;">Where</td>
                  <td style="padding-bottom:14px;color:#202124;font-size:14px;">Google Meet / Conference Room A</td>
                </tr>
                <tr>
                  <td style="padding-bottom:14px;color:#5f6368;font-size:14px;vertical-align:top;">Who</td>
                  <td style="padding-bottom:14px;color:#202124;font-size:14px;">organizer@example.com<br>you@example.com</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- RSVP -->
          <tr>
            <td style="padding:0 24px 20px 24px;">
              <p style="color:#5f6368;font-size:14px;margin:0 0 12px 0;">Going?</p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right:8px;"><a href="#" style="display:inline-block;padding:8px 20px;background-color:#1a73e8;color:#ffffff;text-decoration:none;border-radius:4px;font-size:14px;">Yes</a></td>
                  <td style="padding-right:8px;"><a href="#" style="display:inline-block;padding:8px 20px;background-color:#ffffff;color:#1a73e8;text-decoration:none;border:1px solid #dadce0;border-radius:4px;font-size:14px;">Maybe</a></td>
                  <td><a href="#" style="display:inline-block;padding:8px 20px;background-color:#ffffff;color:#1a73e8;text-decoration:none;border:1px solid #dadce0;border-radius:4px;font-size:14px;">No</a></td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 24px;background-color:#fafafa;border-top:1px solid #eeeeee;color:#5f6368;font-size:12px;line-height:18px;">
              Invitation from <a href="#" style="color:#1a73e8;text-decoration:none;">Google Calendar</a>.<br>
              You are receiving this email because you are an attendee on this event.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
